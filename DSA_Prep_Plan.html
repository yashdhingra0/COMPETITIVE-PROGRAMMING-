<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA prep plan</title>
<style>
  :root {
    --bg: #f3efe6;
    --paper: #fffdf8;
    --ink: #1c1915;
    --muted: #5e574c;
    --line: #e3d9c8;
    --teal: #0f5c56;
    --teal-soft: #e5f3f1;
    --rust: #8c3b16;
    --easy: #1f7a45;
    --easy-bg: #e5f6ea;
    --med: #8a5a00;
    --med-bg: #fff1cc;
    --hard: #9c3412;
    --hard-bg: #fde8e1;
    --core: #163a72;
    --core-bg: #e7f0fa;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(243, 239, 230, 0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 22px 10px;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.03em;
    margin: 0;
  }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .progress-wrap { min-width: 220px; }
  .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bar { height: 8px; background: #e7e0d4; border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--teal); width: 0; }
  nav {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  nav button {
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  nav button[aria-current="page"] {
    background: var(--ink);
    color: #f6f1e7;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 18px 64px; }
  .lede {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 20px;
    line-height: 1.4;
    max-width: 68ch;
    margin: 0 0 18px;
  }
  .grid { display: grid; gap: 12px; }
  .week {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 12px;
    box-shadow: var(--shadow);
  }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
  h2, h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 600; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 2px 0 0; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  .block { margin-top: 10px; }
  .block p { margin: 0; }
  .label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .done-line { border-left: 3px solid var(--teal); padding-left: 10px; }
  .status {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 4px 6px;
    color: var(--ink);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 12px;
    align-items: center;
  }
  input[type="search"], select.f {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--ink);
  }
  input[type="search"] { min-width: min(100%, 280px); }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: #f7f3ea; position: sticky; top: var(--nav-h, 0px); z-index: 4; box-shadow: inset 0 -1px 0 var(--line); }
  .col-status { width: 132px; }
  .col-wk { width: 52px; }
  .col-level { width: 118px; }
  .col-topic { width: 168px; }
  tr:last-child td { border-bottom: 0; }
  .title { font-weight: 600; }
  a { color: var(--teal); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .Easy { color: var(--easy); background: var(--easy-bg); }
  .Medium { color: var(--med); background: var(--med-bg); }
  .Hard { color: var(--hard); background: var(--hard-bg); }
  .Core { color: var(--core); background: var(--core-bg); }
  .High { color: #5c4a12; background: #f6efd4; }
  .Practice { color: var(--muted); background: #f0ebe3; }
  .approach { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .companies { color: var(--muted); font-size: 12px; max-width: 280px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .card + .card { margin-top: 10px; }
  .rowline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .hidden { display: none !important; }
  .note {
    background: var(--teal-soft);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    max-width: 78ch;
  }
  button.linkish {
    background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; padding: 0;
  }
  @media (max-width: 800px) {
    .companies { max-width: 160px; }
    h1 { font-size: 24px; }
  }
  @media print {
    header.top { position: static; }
    nav, .toolbar, .status, .progress-wrap { display: none !important; }
    body { background: white; }
    .week, .card, table { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div>
      <h1>DSA prep</h1>

    </div>
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">Core solved 0 / 0</div>
      <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>
    </div>
  </div>
  <nav id="nav" aria-label="Sections">
    <button type="button" data-view="plan">Plan</button>
    <button type="button" data-view="problems">Problems</button>
    <button type="button" data-view="companies">Companies</button>

    <button type="button" data-view="lld">LLD</button>
    <button type="button" data-view="ai">AI</button>
    <button type="button" data-view="patterns">Patterns</button>
  </nav>
</header>

ra": "Longest Consecutive Sequence; Encode and Decode Strings; Valid Sudoku", "notes": "No system design yet. On Sunday write one page: complement lookup, frequency count, and grouping by a signature.", "done": "From a blank editor, Two Sum and Group Anagrams take under 20 minutes, including time and space.", "hours": 8}, {"week": 2, "phase": "DSA", "focus": "Two pointers and sliding window", "must": "Valid Palindrome; 3Sum; Container With Most Water; Longest Substring Without Repeating Characters; Longest Repeating Character Replacement; Minimum Window Substring", "extra": "Permutation in String; Sliding Window Maximum; Trapping Rain Water", "notes": "Two pointers move by a value rule. A window grows and shrinks by a validity rule. Write that distinction down.", "done": "Before coding, you can say whether it is a pair, a fixed window, or a variable window.", "hours": 9}, {"week": 3, "phase": "DSA", "focus": "Stacks and binary search", "must": "Valid Parentheses; Min Stack; Daily Temperatures; Evaluate Reverse Polish Notation; Binary Search; Search in Rotated Sorted Array", "extra": "Find Minimum in Rotated Sorted Array; Koko Eating Bananas; Largest Rectangle in Histogram; Car Fleet", "notes": "Write the binary-search template you will reuse: the search space, the condition, and which half you drop.", "done": "Rotated-array search does not mix up the sorted half, and you can explain a monotonic stack in one sentence.", "hours": 9}, {"week": 4, "phase": "DSA", "focus": "Linked lists", "must": "Reverse Linked List; Merge Two Sorted Lists; Linked List Cycle; Remove Nth Node From End of List; Reorder List; Copy List with Random Pointer", "extra": "Add Two Numbers; Merge k Sorted Lists; LRU Cache", "notes": "Draw the pointers before coding reverse, reorder, and cycle. LRU is the bridge into design.", "done": "Reverse, cycle, and remove-nth are clean on the first try. You can sketch LRU's map plus list.", "hours": 8}, {"week": 5, "phase": "DSA", "focus": "Trees, the traversals", "must": "Invert Binary Tree; Maximum Depth of Binary Tree; Diameter of Binary Tree; Balanced Binary Tree; Binary Tree Level Order Traversal; Lowest Common Ancestor of a Binary Search Tree; Validate Binary Search Tree; Kth Smallest Element in a BST", "extra": "Binary Tree Right Side View; Same Tree; Subtree of Another Tree", "notes": "Most tree problems are: what should this subtree tell its parent? Write DFS return values versus BFS levels.", "done": "Diameter, level order, and validate BST are explainable out loud while you code.", "hours": 9}, {"week": 6, "phase": "DSA", "focus": "Trees, the harder shapes", "must": "Lowest Common Ancestor of a Binary Tree; Construct Binary Tree from Preorder and Inorder Traversal; Binary Tree Maximum Path Sum; Serialize and Deserialize Binary Tree; Path Sum III; Count Good Nodes in Binary Tree", "extra": "All Nodes Distance K In Binary Tree; Binary Tree Zigzag Level Order Traversal", "notes": "Serialize and deserialize is the tree question that shows whether the recursion is real.", "done": "You can build a tree from preorder and inorder on paper, then in code, without looking.", "hours": 9}, {"week": 7, "phase": "DSA", "focus": "Graphs, the first layer", "must": "Number of Islands; Clone Graph; Rotting Oranges; Pacific Atlantic Water Flow; Course Schedule; Course Schedule II", "extra": "Max Area of Island; Surrounded Regions; Walls and Gates", "notes": "Write when you pick DFS, BFS, or topological sort. Islands and course schedule are the same graph idea.", "done": "You can type a BFS and a DFS from memory, and detect a cycle in a directed graph.", "hours": 9}, {"week": 8, "phase": "DSA", "focus": "Graphs, weighted and tricky", "must": "Word Ladder; Network Delay Time; Cheapest Flights Within K Stops; Min Cost To Connect All Points; Alien Dictionary; Accounts Merge", "extra": "Swim In Rising Water; Path With Minimum Effort; Redundant Connection", "notes": "Name Dijkstra, MST, or topological sort before you code.", "done": "A small Dijkstra works, and alien dictionary is precedence edges plus a topo sort.", "hours": 10}, {"week": 9, "phase": "DSA", "focus": "Heaps, intervals, greedy", "must": "Merge Intervals; Insert Intervals; Non-overlapping Intervals; Meeting Rooms II; Task Scheduler; Find Median from Data Stream", "extra": "Kth Largest Element in an Array; Jump Game; Gas Station; Partition Labels", "notes": "Sorting intervals by start and by end are different decisions. Write why.", "done": "Meeting Rooms II and merge intervals are under 25 minutes. Median of a stream is a picture you can draw.", "hours": 9}, {"week": 10, "phase": "DSA", "focus": "Backtracking and tries", "must": "Subsets; Combination Sum; Permutations; Letter Combinations of a Phone Number; Word Search; Implement Trie", "extra": "Palindrome Partitioning; N-Queens; Word Search II; Generate Parentheses", "notes": "Backtracking is choose, explore, undo. A trie is the prefix version of a hash map.", "done": "Subsets and permutations share one template in your notes. Trie insert and search are short.", "hours": 9}, {"week": 11, "phase": "DSA", "focus": "Dynamic programming, one dimension", "must": "Climbing Stairs; House Robber; House Robber II; Coin Change; Longest Increasing Subsequence; Word Break", "extra": "Decode Ways; Maximum Product Subarray; Partition Equal Subset Sum; Combination Sum IV", "notes": "For every DP, write the state in a sentence before the code: dp[i] means ___.", "done": "House robber and coin change have states you can define without the editorial.", "hours": 10}, {"week": 12, "phase": "DSA", "focus": "Dynamic programming, two dimensions", "must": "Unique Paths; Longest Common Subsequence; Longest Palindromic Substring; Edit Distance; Target Sum; Coin Change Ii", "extra": "Interleaving String; Best Time To Buy And Sell Stock With Cooldown; Burst Balloons; Regular Expression Matching", "notes": "Burst balloons and regex are stretch problems. Do them after edit distance feels normal.", "done": ns-by-subha-2yz5"}, {"rank": 9, "title": "Ticket booking classes", "posts": 6, "years": "2023-2024-2025", "companies": "Amazon", "level": "SDE1 and SDE2", "hours": 2, "practice": "Show, seat, booking. Two people selecting one seat is the case to lock.", "url": "https://leetcode.com/discuss/post/kotak-mahindra-bar-raiser-round-sde2-by-tgzz1"}, {"rank": 10, "title": "In-memory file system", "posts": 5, "years": "2023-2024-2025-2026", "companies": "Google, Amazon, Microsoft, Oracle", "level": "SDE2", "hours": 2, "practice": "Directory trie. Path parsing is half the work.", "url": "https://leetcode.com/discuss/post/unix-file-api-amazon-ood-my-take-by-lgor-4u6t"}, {"rank": 11, "title": "Tic-tac-toe or Connect Four", "posts": 5, "years": "2023-2024-2025", "companies": "Google, Amazon, Meta, Atlassian, Flipkart", "level": "SDE1", "hours": 1, "practice": "Board, players, and a win check on the last move only.", "url": "https://leetcode.com/discuss/post/tic-tac-toe-lld-by-anonymous_user-dfd4"}, {"rank": 12, "title": "Car rental", "posts": 4, "years": "2023-2025", "companies": "Flipkart, Amazon", "level": "SDE1", "hours": 1.5, "practice": "A vehicle and a reservation interval. No double booking.", "url": "https://leetcode.com/discuss/post/car-rental-system-typescript-javascript-ci8g3"}, {"rank": 13, "title": "Elevator", "posts": 4, "years": "2024-2025", "companies": "", "level": "SDE2", "hours": 2, "practice": "Request and a scheduling strategy. Closest car versus one direction at a time.", "url": "https://leetcode.com/discuss/post/500-lld-question-with-solutions-by-subha-2yz5"}, {"rank": 14, "title": "Coupons", "posts": 3, "years": "2024-2026", "companies": "", "level": "SDE2", "hours": 1.5, "practice": "Rules as objects applied to a cart, in an explicit order.", "url": "https://leetcode.com/discuss/post/coupon-management-system-system-design-i-ld1y"}, {"rank": 15, "title": "Locker", "posts": 2, "years": "2024-2025", "companies": "Amazon", "level": "SDE1", "hours": 1.5, "pra tice": "Streaming tokens, timeouts, batching, and cost per user. KV cache is a sentence, not a kernel lecture.", "url": "https://leetcode.com/discuss/post/how-to-learn-lld-by-saurabhskukreja-fpcg"}, {"rank": 2, "title": "Recommendation systems", "posts": 4, "years": "2024-2025", "companies": "", "level": "SDE2", "hours": 2, "practice": "Candidates, then a ranker, then features you can compute online. Do not leak the label.", "url": "https://leetcode.com/discuss/post/suggestion-for-best-free-resources-on-sy-kvvp"}, {"rank": 3, "title": "Design RAG over private documents", "posts": 2, "years": "2025", "companies": "Google, Meta", "level": "SDE2 and AI roles", "hours": 2.5, "practice": "Ingest, chunk, embed, retrieve, prompt, answer. Then how you notice a wrong answer, and how private docs stay out of training.", "url": "https://leetcode.com/discuss/post/how-chatgpt-model-is-deployed-at-large-s-casd"}, {"rank": 4, "title": "Design a code assistant", "posts": 1, "years": "2025", "companies": "", "level": "AI roles", "hours": 1.5, "practice": "Repo context, retrieval of the relevant files, and a check that the suggestion actually runs.", "url": "https://leetcode.com/discuss/post/the-rise-of-ai-in-interviews-is-grinding-m4ir"}, {"rank": 5, "title": "Guardrails, prompt injection, and PII", "posts": 1, "years": "2022", "companies": "Amazon", "level": "SDE2 and AI roles", "hours": 1.5, "practice": "Retrieved text is data, not instructions. Strip secrets before the prompt. Limit how long you keep logs.", "url": "https://leetcode.com/discuss/post/design-analytics-system-by-praveennvs0-4gn7"}, {"rank": 6, "title": "ML metrics that still get asked", "posts": 1, "years": "2025", "companies": "Goldman Sachs", "level": "Every ML-flavored loop", "hours": 1.5, "practice": "Precision, recall, why accuracy lies when classes are unbalanced, and a baseline that is almost embarrassing.", "url": "https://leetcode.com/discuss/post/goldman-sachs-analyst-interview-experien-3cm8"}, {"rank": 7, "title": "Moderation for generated output", "posts": 1, "years": "2024", "companies": "", "level": "SDE2", "hours": 1.5, "practice": "Classify before you show it. Humans see the uncertain band.", "url": "https://leetcode.com/discuss/post/real-time-content-moderation-system-aill-88k5"}, {"rank": 8, "title": "Transformers at interview depth", "posts": 1, "years": "2025", "companies": "", "level": "AI roles", "hours": 1.5, "practice": "Tokens, embeddings, attention as a weighted mix of other tokens, and why a long context costs memory.", "url": "https://leetcode.com/discuss/post/expedia-ml-scientist-iii-interview-exper-gsfk"}, {"rank": 9, "title": "Agents that call tools", "posts": 0, "years": "Not in this tag sample", "companies": "", "level": "2025-2026 loops", "hours": 1.5, "practice": "The model picks a tool, you run it, you append the result, you stop on a budget. Log every step.", "url": ""}, {"rank": 10, "title": "Deploy, monitor, rollback", "posts": 0, "years": "Not in this tag sample", "companies": "", "level": "SDE2 and ML platform", "hours": 1.5, "practice": "Canary, one metric that means the model got worse, and a switch back to the previous version.", "url": ""}, {"rank": 11, "title": "Embeddings, chunking, hybrid search", "posts": 0, "years": "Not in this tag sample", "companies": "", "level": "SDE2 and AI roles", "hours": 1.5, "practice": "Chunk size changes what you retrieve. Hybrid is keywords plus vectors. Rerank the top handful.", "url": ""}, {"rank": 12, "title": "Evaluation and hallucination", "posts": 0, "years": "Not in this tag sample", "companies": "", "level": "AI roles", "hours": 1.5, "practice": "A small labeled set on every prompt change. Faithful means the answer stays inside the retrieved text.", "url": ""}, {"rank": 13, "title": "Fine-tune vs RAG vs prompting", "posts": 0, "years": "Not in this tag sample", "companies": "", "level": "Every AI loop", "hours": 1, "practice": "Prompt when the facts fit the context. RAG when facts change or "name": "Intervals", "idea": "Meetings and ranges.", "when": "Sort by start or by end, and know which.", "practice": "Merge Intervals; Meeting Rooms II"}, {"name": "Backtracking", "idea": "Build a candidate and undo.", "when": "The output is combinations, permutations, or paths.", "practice": "Subsets; Word Search; N-Queens"}, {"name": "Trie", "idea": "Prefixes.", "when": "A set of whole words cannot share prefixes.", "practice": "Implement Trie; Word Search II"}, {"name": "Dynamic programming", "idea": "The same subproblem returns.", "when": "Write dp[i] means ___ before any code.", "practice": "House Robber; Coin Change; Edit Distance; LCS"}, {"name": "Greedy", "idea": "A local choice is safe because of a sort.", "when": "If you cannot justify the choice, it is probably DP.", "practice": "Jump Game; Non-overlapping Intervals"}, {"name": "Coding design", "idea": "A class with a complexity target.", "when": "Name the structure for lookup and the structure for order.", "practice": "LRU; Insert Delete GetRandom"}, {"name": "HLD", "idea": "Millions of users.", "when": "Requirements and one number before any product name like Kafka.", "practice": "URL shortener; chat; feed; rides; queue"}, {"name": "LLD", "idea": "Classes and one hard method.", "when": "Name the invariant: no double book, no double charge, O(1) get.", "practice": "Parking lot; Splitwise; tickets"}, {"name": "AI design", "idea": "A model feature in production.", "when": "Separate private knowledge (RAG), behavior (fine-tune), and serving cost.", "practice": "RAG; eval; guardrails"}], "checks": [{"label": "Before code", "text": "Restate it in two sentences. Nouns become classes. Verbs become methods. Ask what must never happen."}, {"label": "Classes", "text": "A board is not a player. A copy of a book is not the title. A payment is not a ledger line."}, {"label": "State", "text": "If it has modes, write them down and reject illegal moves. Orders, bookings, and vending machines are state machines."}, {"label": "The hard method", "text": "Spend the time on park, settle, bookSeat, allow, get, and put. Getters are not the interview."}, {"label": "Concurrency", "text": "Name the object you would lock even if you never start a thread. Seat, stock, and cache size are the usual ones."}, {"label": "Patterns", "text": "Strategy for a swappable rule. Command for undo. Do not decorate a parking lot for sport."}, {"label": "Done", "text": "Walk the happy path, the full or empty case, and the double submit. One sentence for the complexity of the hard method."}]}</script>
<script>
const data = JSON.parse(document.getElementById("payload").textContent);
const KEY = "dsa-prep-plan-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { progress = {}; }
if (!progress.problem) progress.problem = {};
if (!progress.week) progress.week = {};
if (!progress.design) progress.design = {};

const app = document.getElementById("app");
const STATUSES = ["", "Not started", "Doing", "Solved", "Revise", "Skip-known"];

function save() {
  localStorage.setItem(KEY, JSON.stringify(progress));
  renderProgress();
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function statusSelect(kind, id, current) {
  const opts = STATUSES.map(v => `<option value="${esc(v)}"${v===current?" selected":""}>${v || "—"}</option>`).join("");
  return `<select class="status" data-kind="${kind}" data-id="${esc(id)}">${opts}</select>`;
}
function renderProgress() {
  const core = data.problems.filter(p => p.priority === "Core");
  const done = core.filter(p => ["Solved", "Skip-known"].includes(progress.problem[p.id])).length;
  document.getElementById("progressLabel").textContent = `Core solved ${done} / ${core.length}`;
  document.getElementById("progressBar").style.width = core.length ? `${Math.round(100 * done / core.length)}%` : "0";
}
function companyList(s) {
  return String(s || "").split(",").map(part => part.replace(/\s*\(\d+\)\s*/g, "").replace(/\+\d+\s+more/, "").trim()).filter(Boolean);
}
function pill(value) {
  if (!value) return "";
  return `<span class="pill ${esc(value)}">${esc(value)}</span>`;
}
function link(url, label) {
  if (!url) return "";
  return `<a href="${esc(url)}">${esc(label)}</a>`;
}

function showPlan() {
  const html = [`<p class="lede">Start at week 1. A weekday is one real attempt, then a five-line note. Saturday is a 45-minute mock. Mark a problem Skip-known only if you can code the optimal solution in under 20 minutes and explain it.</p>`];
  html.push(`<div class="grid">`);
  for (const week of data.plan) {
    const current = progress.week[week.week] || "";
    html.push(`<article class="week">
      <div class="head">
        <div>
          <div class="kicker">Week ${week.week} · ${esc(week.phase)} · ${esc(week.hours)} hours</div>
          <h2>${esc(week.focus)}</h2>
        </div>
        ${statusSelect("week", week.week, current)}
      </div>
      <div class="block"><div class="label">Must</div><p>${esc(week.must)}</p></div>
      ${week.extra ? `<div class="block"><div class="label">Extra</div><p>${esc(week.extra)}</p></div>` : ""}
      <div class="block"><div class="label">Also</div><p>${esc(week.notes)}</p></div>
      <div class="block done-line"><div class="label">Done when</div><p>${esc(week.done)}</p></div>
    </article>`);
  }
  html.push(`</div>`);
  app.innerHTML = html.join("");
}

let problemFilter = { q: "", topic: "", difficulty: "", priority: "", source: "", week: "", discuss: false, linked: false };

function showProblems() {
  const topics = [...new Set(data.problems.map(p => p.topic))].sort();
  const weeks = [...new Set(data.problems.map(p => p.week).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
  const sources = ["Fraz", "Apna College", "Love Babbar", "Siddharth Singh", "Arsh Goyal"];
  app.innerHTML = `
    <p class="lede">All ${data.problems.length} problems are listed. The same question from several sheets is one row. Choose a sheet to see only that list, or set Priority to Core for the 82-problem plan.</p>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search problem, pattern, company" value="${esc(problemFilter.q)}" aria-label="Search problems">
      <select class="f" id="source" aria-label="Sheet"><option value="">All sheets</option>${sources.map(s => `<option${s===problemFilter.source?" selected":""}>${esc(s)}</option>`).join("")}</select>
      <select class="f" id="topic" aria-label="Topic"><option value="">All topics</option>${topics.map(t => `<option${t===problemFilter.topic?" selected":""}>${esc(t)}</option>`).join("")}</select>
      <select class="f" id="difficulty" aria-label="Difficulty"><option value="">All difficulties</option>${["Easy","Medium","Hard"].map(d => `<option${d===problemFilter.difficulty?" selected":""}>${d}</option>`).join("")}</select>
      <select class="f" id="priority" aria-label="Priority"><option value="">All priorities</option>${["Core","High","Practice"].map(d => `<option${d===problemFilter.priority?" selected":""}>${d}</option>`).join("")}</select>
      <select class="f" id="week" aria-label="Week"><option value="">All weeks</option>${weeks.map(w => `<option value="${esc(w)}"${String(w)===String(problemFilter.week)?" selected":""}>Week ${esc(w)}</option>`).join("")}</select>
      <label><input type="checkbox" id="discuss" ${problemFilter.discuss?"checked":""}> Discuss highlight</label>
      <label><input type="checkbox" id="linked" ${problemFilter.linked?"checked":""}> Has LeetCode link</label>
      <span class="count" id="shown"></span>
    </div>
    <table>
      <thead><tr><th class="col-status">Status</th><th class="col-wk">Wk</th><th>Problem</th><th class="col-level">Level</th><th class="col-topic">Topic</th><th>Companies</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>`;
  const draw = () => {
    const q = problemFilter.q.trim().toLowerCase();
    const rows = data.problems.filter(p => {
      if (problemFilter.topic && p.topic !== problemFilter.topic) return false;
      if (problemFilter.difficulty && p.difficulty !== problemFilter.difficulty) return false;
      if (problemFilter.priority && p.priority !== problemFilter.priority) return false;
      if (problemFilter.source && !(p.sources || "").includes(problemFilter.source)) return false;
      if (problemFilter.week && String(p.week) !== String(problemFilter.week)) return false;
      if (problemFilter.discuss && !p.discuss) return false;
      if (problemFilter.linked && !p.url) return false;
      if (q) {
        const hay = `${p.title} ${p.topic} ${p.pattern} ${p.companies} ${p.approach}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    document.getElementById("shown").textContent = `${rows.length} shown`;
    document.getElementById("rows").innerHTML = rows.map(p => `<tr>
      <td>${statusSelect("problem", p.id, progress.problem[p.id] || "")}</td>
      <td>${esc(p.week)}</td>
      <td><div class="title">${p.url ? link(p.url, p.title) : esc(p.title)}</div>
        <div class="approach">${esc(p.pattern)}${p.approach ? " — " + esc(p.approach) : ""}</div></td>
      <td>${pill(p.difficulty)} ${pill(p.priority)}</td>
      <td>${esc(p.topic)}<div class="approach">${esc(p.sources || "")}</div></td>
      <td class="companies">${esc(p.companies)}</td>
    </tr>`).join("");
  };
  const bind = (id, key, isCheck) => {
    document.getElementById(id).addEventListener("input", e => {
      problemFilter[key] = isCheck ? e.target.checked : e.target.value;
      draw();
    });
  };
  bind("q", "q"); bind("source", "source"); bind("topic", "topic"); bind("difficulty", "difficulty");
  bind("priority", "priority"); bind("week", "week");
  bind("discuss", "discuss", true); bind("linked", "linked", true);
  draw();
}

function showCompanies() {
  const names = [...new Set(data.tracks.map(t => t.company))];
  const saved = sessionStorage.getItem("dsa-company") || names[0] || "";
  app.innerHTML = `
    <p class="lede">Top problems reported for each company. The weight is a relative community count, not this month’s official frequency.</p>
    <div class="toolbar">
      <select class="f" id="company" aria-label="Company">${names.map(n => `<option${n===saved?" selected":""}>${esc(n)}</option>`).join("")}</select>
    </div>
    <table><thead><tr><th>#</th><th>Problem</th><th></th><th>Topic</th><th>Weight</th></tr></thead><tbody id="crows"></tbody></table>`;
  const draw = () => {
    const name = document.getElementById("company").value;
    sessionStorage.setItem("dsa-company", name);
    const rows = data.tracks.filter(t => t.company === name);
    document.getElementById("crows").innerHTML = rows.map(t => `<tr>
      <td>${t.rank}</td>
      <td class="title">${t.url ? link(t.url, t.title) : esc(t.title)}</td>
      <td>${pill(t.difficulty)} ${pill(t.priority)}</td>
      <td>${esc(t.topic)}</td>
      <td>${esc(t.weight)}</td>
    </tr>`).join("");
  };
  document.getElementById("company").addEventListener("change", draw);
  draw();
}

function showDesign(kind, title, lede) {
  const rows = data[kind];
  const checks = kind === "lld" ? `<div class="card"><h3>Before you code a class</h3>${data.checks.map(c => `<p><strong>${esc(c.label)}.</strong> ${esc(c.text)}</p>`).join("")}</div>` : "";
  app.innerHTML = `<p class="lede">${esc(lede)}</p>${checks}` + rows.map(r => `<article class="card">
    <div class="rowline">
      <span class="kicker">${esc(r.posts)} discuss posts · ${esc(r.years)}</span>
      ${statusSelect("design", kind + "-" + r.rank, progress.design[kind + "-" + r.rank] || "")}
    </div>
    <h2>${esc(r.title)}</h2>
    <p class="meta">${esc(r.level)} · ${esc(r.hours)} hours${r.companies ? " · " + esc(r.companies) : ""}</p>
    <p>${esc(r.practice)}</p>
    ${r.url ? `<p>${link(r.url, "Example discuss post")}</p>` : ""}
  </article>`).join("");
}

function showPatterns() {
  app.innerHTML = `<p class="lede">Name the pattern before you code. If you cannot justify a greedy choice, it is probably dynamic programming.</p>` +
    data.patterns.map(p => `<article class="card"><h3>${esc(p.name)}</h3><p>${esc(p.idea)}</p><p><span class="label">When</span><br>${esc(p.when)}</p><p class="meta">${esc(p.practice)}</p></article>`).join("");
}

const views = {
  plan: showPlan,
  problems: showProblems,
  companies: showCompanies,
  hld: () => showDesign("hld", "HLD", "Outline on paper for 45 minutes: requirements, API, data model, one bottleneck, and what you would shard. Counts are LeetCode Discuss mentions from Oct 2022 through Oct 2026."),
  lld: () => showDesign("lld", "LLD", "Nouns become classes. Spend the hour on the one method that can go wrong: park, settle, book, or get."),
  ai: () => showDesign("ai", "AI", "Be able to design RAG in 20 minutes, and say when you would fine-tune instead. A zero count means the idea is still worth practicing even if this tag sample barely named it."),
  patterns: showPatterns,
};

function activate(view) {
  document.querySelectorAll("#nav button").forEach(btn => {
    if (btn.dataset.view === view) btn.setAttribute("aria-current", "page"); else btn.removeAttribute("aria-current");
  });
  location.hash = view;
  views[view]();
  renderProgress();
}

document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (btn) activate(btn.dataset.view);
});
app.addEventListener("change", e => {
  const sel = e.target.closest("select.status");
  if (!sel) return;
  const kind = sel.dataset.kind;
  const id = sel.dataset.id;
  progress[kind] = progress[kind] || {};
  if (!sel.value) delete progress[kind][id];
  else progress[kind][id] = sel.value;
  save();
});

function pinTableHead() {
  const bar = document.querySelector("header.top");
  if (bar) document.documentElement.style.setProperty("--nav-h", bar.offsetHeight + "px");
}
pinTableHead();
window.addEventListener("resize", pinTableHead);
const initial = (location.hash || "#plan").slice(1);
activate(views[initial] ? initial : "plan");
pinTableHead();
</script>
</body>
</html>
